[profile.default]
src = "src"
out = "out"
libs = ["lib"]
allow_paths = ["lib", "src", "script", "test"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read-write", path = "./docs" },
]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"

[lint]
exclude_lints = ["unsafe-typecast"]

[rpc_endpoints]
local = "http://127.0.0.1:8545"
bsc = "${BSC_RPC_URL}"
